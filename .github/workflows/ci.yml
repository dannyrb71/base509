# PetAppro — CI gate (D-050)
# Runs on every PR targeting main and on direct pushes to main.
# Blocks merge on: lint failure, tsc error, unit/golden test failure.
# E2E (Maestro) runs on PRs only when the app directory is non-empty (post-scaffold).
#
# Secrets required (set in repo Settings → Secrets and variables → Actions):
#   SENTRY_AUTH_TOKEN  — for release / source-map upload on EAS build (not needed for CI tests)
#   EAS_TOKEN          — Expo Application Services token (needed for EAS build job below)
#
# No secrets are required for the lint/tsc/test jobs — those run cleanly on any fork PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Lint + strict tsc ────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/pricing/package-lock.json

      # packages/pricing has its own node_modules; install it
      - name: Install pricing deps
        working-directory: packages/pricing
        run: npm ci

      # Strict tsc — exactOptionalPropertyTypes + noUncheckedIndexedAccess (tsconfig.json)
      - name: TypeScript (packages/pricing)
        working-directory: packages/pricing
        run: npx tsc --noEmit

      # When apps/mobile is scaffolded, add:
      #   - name: Install app deps
      #     working-directory: apps/mobile
      #     run: npm ci
      #   - name: TypeScript (apps/mobile)
      #     working-directory: apps/mobile
      #     run: npx tsc --noEmit
      #   - name: Lint (apps/mobile)
      #     working-directory: apps/mobile
      #     run: npx eslint . --max-warnings 0

  # ─── 2. Unit + golden tests (packages/pricing) ───────────────────────────────
  pricing-tests:
    name: Pricing unit + golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/pricing/package-lock.json

      - name: Install pricing deps
        working-directory: packages/pricing
        run: npm ci

      - name: Run tests (vitest)
        working-directory: packages/pricing
        run: npm test -- --reporter=verbose

  # ─── 3. CFG-1 DB gate (§6 go/no-go) + generated-type drift ──────────────────
  # The spec's definition of done: the full RLS/RBAC/entitlement/capacity/
  # identity/concurrency suite passes against a fresh Postgres 15 (matching
  # prod), and packages/data types regenerate without drift.
  db-tests:
    name: CFG-1 DB gate (§6) + type drift
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:15 + PostGIS preinstalled — PG15 matches prod; PostGIS
        # backs the zone-geometry validation trigger.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            supabase/tests/package-lock.json
            packages/data/package-lock.json

      - name: Install DB test deps
        working-directory: supabase/tests
        run: npm ci

      - name: Run §6 gate (fresh-DB migrate + full suite)
        working-directory: supabase/tests
        env:
          CFG1_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
        run: npm test

      - name: Typecheck DB tests
        working-directory: supabase/tests
        run: npx tsc --noEmit

      - name: Install packages/data deps
        working-directory: packages/data
        run: npm ci

      - name: Generated-type drift check (packages/data)
        working-directory: packages/data
        env:
          CFG1_TYPEGEN_DB_URL: postgres://postgres:postgres@127.0.0.1:55432/cfg1_test
        run: |
          npm run gen
          git diff --exit-code -- src/database.types.ts

      - name: Typecheck packages/data
        working-directory: packages/data
        run: npx tsc --noEmit

  # ─── 4. E2E tests (Maestro) — gated on app existing ─────────────────────────
  # Uncomment and complete once apps/mobile is scaffolded and a physical/emulator
  # runner is available. The flow YAML files in e2e/flows/ are already committed.
